services:
  postgres:
    image: postgres:16-alpine
    container_name: welfare-finder-postgres
    environment:
      POSTGRES_DB: welfare_finder
      POSTGRES_USER: welfare
      POSTGRES_PASSWORD: welfare
    ports:
      - "5432:5432"
    volumes:
      - welfare_finder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welfare -d welfare_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  welfare_finder_pgdata:
